[project]
name = "timekotiki"
version = "0.1.0"
description = "Generate video chapter timecodes from a local video file, fully offline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "faster-whisper>=1.1",
    # faster-whisper 1.2 calls av.open(metadata_errors=...), which PyAV 19 removed.
    "av>=12,<19",
]

[project.scripts]
timekotiki = "timekotiki.cli:run"

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timekotiki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: requires real ASR/LLM models"]
addopts = "-m 'not models'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*", "av", "av.*", "ctranslate2"]
ignore_missing_imports = true
